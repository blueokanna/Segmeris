name: Validate, build and release

on:
  push:
    branches: [main, testchain]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Existing vMAJOR.MINOR.PATCH tag pointing at the selected commit; empty builds without publishing.'
        required: false
        default: ''
      skip_docker:
        description: 'Skip publishing the Docker image (the API image is still validated).'
        type: boolean
        default: false
      skip_ios:
        description: 'Skip the unsigned iOS archive on a manual run.'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  FLUTTER_VERSION: '3.50.0'
  PUB_HOSTED_URL: https://pub.dev
  FLUTTER_STORAGE_BASE_URL: https://storage.googleapis.com

jobs:
  prepare:
    name: Validate release intent and immutable source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      build_number: ${{ steps.plan.outputs.build_number }}
      commit: ${{ steps.plan.outputs.commit }}
      publish: ${{ steps.plan.outputs.publish }}
      build_apps: ${{ steps.plan.outputs.build_apps }}
      build_windows: ${{ steps.plan.outputs.build_windows }}
      ios_enabled: ${{ steps.plan.outputs.ios_enabled }}
      docker_enabled: ${{ steps.plan.outputs.docker_enabled }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Plan and validate existing release tag
        id: plan
        env:
          MANUAL_TAG: ${{ inputs.tag_name }}
          SKIP_IOS: ${{ inputs.skip_ios }}
          SKIP_DOCKER: ${{ inputs.skip_docker }}
        run: python3 scripts/release.py plan

  validate:
    name: Validate source, versions and native contracts
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - name: Check release version and packaging contracts
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          python3 scripts/check_versions.py
          python3 scripts/check_app_identity.py
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Verify launcher artwork and browser theme changes
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pil
          /usr/bin/python3 -m unittest discover -s test/branding -p '*_test.py'
          node --test test/branding/web_brand_theme_test.cjs
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable installer
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Resolve locked Flutter packages
        run: flutter pub get --enforce-lockfile
      - name: Validate Rust runtime and no_std core
        working-directory: rust
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --features api-server --locked -- -D warnings
          cargo test --workspace --features api-server --locked
          cargo check -p segmeris-core --no-default-features --locked
          cargo package -p segmeris-core --locked --allow-dirty
      - name: Validate Flutter application
        run: |
          flutter analyze --no-pub
          flutter test --no-pub

  security-scan:
    name: Scan release dependencies and repository
    needs: [prepare, validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
        with:
          toolchain: stable
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-audit
      - name: Check Rust dependency advisories
        working-directory: rust
        run: cargo audit --deny warnings
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          skip-dirs: build,rust/target,.dart_tool,ios/Pods,macos/Pods
          severity: HIGH,CRITICAL
          exit-code: '1'

  build-android:
    name: Build and verify signed Android APKs
    needs: [prepare, validate]
    if: needs.prepare.outputs.build_apps == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
        with:
          toolchain: stable
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: python3 scripts/release_android.py configure
      - name: Resolve locked packages and build all supported ABIs
        run: |
          flutter pub get --enforce-lockfile
          flutter build apk --release --no-pub --split-per-abi --target-platform=android-arm,android-arm64,android-x64
      - name: Verify certificate, versions, FFI and 16 KiB alignment
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          mkdir -p dist/android
          for abi in arm64-v8a armeabi-v7a x86_64; do
            apk="build/app/outputs/flutter-apk/app-${abi}-release.apk"
            python3 scripts/release_android.py verify --apk "$apk" --abi "$abi"
            cp "$apk" "dist/android/Segmeris-android-${abi}.apk"
          done
      - name: Run Android unit tests and compile device tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin -Ptarget-platform=android-x64 --console=plain
      - name: Cold-start the signed APK in light and dark mode
        timeout-minutes: 12
        run: bash scripts/check_android_launch.sh dist/android/Segmeris-android-x86_64.apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-android
          path: dist/android/*.apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Remove signing material
        if: always()
        run: python3 scripts/release_android.py clean

  build-windows:
    name: Build Windows x64 portable runtime
    needs: [prepare, validate]
    if: needs.prepare.outputs.build_windows == 'true'
    runs-on: windows-2022
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
      - name: Resolve locked packages
        run: flutter pub get --enforce-lockfile
      - name: Build release runtime
        env:
          CMAKE_GENERATOR: Visual Studio 17 2022
          CMAKE_GENERATOR_PLATFORM: x64
        run: ./scripts/build_windows.ps1 -NoPub
      - name: Verify the packaged Rust library through Flutter FFI
        run: flutter test --no-pub test/native_runtime_test.dart --dart-define=SEGMERIS_NATIVE_LIBRARY=build/windows/x64/runner/Release/rust_lib_segmeris.dll
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          update: true
          install: >-
            make nasm diffutils gnupg
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-python
      - name: Build and exercise FFmpeg and ffprobe from pinned source
        shell: msys2 {0}
        run: python scripts/bundle_ffmpeg.py build --prefix build/media-tools --work build/media-source
      - name: Stage media tools with source and license information
        run: python scripts/bundle_ffmpeg.py stage --prefix build/media-tools --destination build/windows/x64/runner/Release/tools
      - name: Package and check runtime dependencies
        run: ./scripts/release_windows.ps1
      - name: Build and test the per-user installer
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          & $compiler "/DReleaseVersion=$env:RELEASE_VERSION" scripts/segmeris.iss
          if ($LASTEXITCODE) { throw "Installer compilation failed" }
          $target = Join-Path $env:RUNNER_TEMP 'segmeris-install-test'
          $setup = Start-Process dist/windows/Segmeris-windows-x64-setup.exe -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR=`"$target`"" -WindowStyle Hidden -Wait -PassThru
          if ($setup.ExitCode) { throw "Installation failed: $($setup.ExitCode)" }
          foreach ($name in 'segmeris.exe', 'rust_lib_segmeris.dll', 'flutter_windows.dll', 'tools/ffmpeg.exe') {
            $installed = Get-FileHash (Join-Path $target $name)
            $original = Get-FileHash (Join-Path 'build/windows/x64/runner/Release' $name)
            if ($installed.Hash -ne $original.Hash) { throw "Installed file differs: $name" }
          }
          $uninstall = Start-Process (Join-Path $target 'unins000.exe') -ArgumentList '/VERYSILENT /NORESTART' -WindowStyle Hidden -Wait -PassThru
          if ($uninstall.ExitCode -or (Test-Path (Join-Path $target 'segmeris.exe'))) { throw "Uninstall failed" }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows-x64
          path: |
            dist/windows/Segmeris-windows-x64.zip
            dist/windows/Segmeris-windows-x64-setup.exe
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  build-linux:
    name: Build Linux x64 portable runtime
    needs: [prepare, validate]
    if: needs.prepare.outputs.build_apps == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev libjsoncpp-dev build-essential nasm gnupg
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
        with:
          toolchain: stable
      - name: Build release runtime
        run: |
          flutter pub get --enforce-lockfile
          flutter build linux --release --no-pub
      - name: Verify the packaged Rust library through Flutter FFI
        run: flutter test --no-pub test/native_runtime_test.dart --dart-define=SEGMERIS_NATIVE_LIBRARY=build/linux/x64/release/bundle/lib/librust_lib_segmeris.so
      - name: Build and exercise FFmpeg and ffprobe from pinned source
        run: python3 scripts/bundle_ffmpeg.py build --prefix build/media-tools --work build/media-source
      - name: Stage media tools with source and license information
        run: python3 scripts/bundle_ffmpeg.py stage --prefix build/media-tools --destination build/linux/x64/release/bundle/tools
      - name: Package and check shared libraries
        run: python3 scripts/release_linux.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux-x64
          path: dist/linux/Segmeris-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  build-macos:
    name: Build macOS ${{ matrix.arch }} (not notarized)
    needs: [prepare, validate]
    if: needs.prepare.outputs.build_apps == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
            macho_arch: x86_64
          - runner: macos-15
            arch: arm64
            macho_arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          architecture: ${{ matrix.arch }}
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
        with:
          toolchain: stable
      - name: Build release application
        run: |
          flutter pub get --enforce-lockfile
          flutter build macos --release --no-pub
      - name: Verify and package the correct Mach-O architecture
        env:
          MACHO_ARCH: ${{ matrix.macho_arch }}
        run: python3 scripts/release_apple.py macos --arch "$MACHO_ARCH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macos-${{ matrix.arch }}
          path: dist/macos/Segmeris-macos-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  build-web:
    name: Build Web JavaScript and WebAssembly bundles
    needs: [prepare, validate]
    if: needs.prepare.outputs.build_apps == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Build and archive both web runtimes
        run: |
          flutter pub get --enforce-lockfile
          mkdir -p dist/web
          flutter build web --release --no-pub
          python3 -c "import shutil; shutil.make_archive('dist/web/Segmeris-web-js', 'zip', 'build/web')"
          flutter build web --release --wasm --no-pub
          python3 -c "import shutil; shutil.make_archive('dist/web/Segmeris-web-wasm', 'zip', 'build/web')"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-web
          path: dist/web/*.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  build-ios:
    name: Build iOS arm64 unsigned archive
    needs: [prepare, validate]
    if: needs.prepare.outputs.ios_enabled == 'true'
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          architecture: arm64
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
        with:
          toolchain: stable
          targets: aarch64-apple-ios
      - name: Verify Rust iOS compilation
        working-directory: rust
        run: cargo check --target aarch64-apple-ios --lib --locked
      - name: Build application without inventing a signing identity
        run: |
          flutter pub get --enforce-lockfile
          flutter build ios --release --no-pub --no-codesign
      - name: Verify and package Payload IPA
        run: python3 scripts/release_apple.py ios --arch arm64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-ios-arm64
          path: dist/ios/Segmeris-ios-arm64-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  docker-validate:
    name: Build and smoke-test the API container
    needs: [prepare, validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.api
          platforms: linux/amd64
          push: false
          load: true
          tags: segmeris-api:validate
      - name: Verify the health endpoint
        run: |
          trap 'docker rm -f segmeris-api-validate >/dev/null 2>&1 || true' EXIT
          docker run -d --name segmeris-api-validate -p 127.0.0.1:3000:3000 segmeris-api:validate
          for attempt in $(seq 1 30); do
            if [ "$(docker inspect --format '{{.State.Running}}' segmeris-api-validate)" != true ]; then
              docker logs segmeris-api-validate
              exit 1
            fi
            if curl -fsS --connect-timeout 1 --max-time 2 http://127.0.0.1:3000/health > health.json; then
              python3 -c 'import json; h=json.load(open("health.json")); assert h == {"status":"ok","service":"segmeris-api"}, h'
              exit 0
            fi
            sleep 1
          done
          docker logs segmeris-api-validate
          exit 1

  release-gate:
    name: Require every planned release artifact and check
    if: always() && needs.prepare.outputs.publish == 'true'
    needs: [prepare, validate, security-scan, build-android, build-windows, build-linux, build-macos, build-web, build-ios, docker-validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - name: Reject failed, cancelled or unintended skipped jobs
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          IOS_ENABLED: ${{ needs.prepare.outputs.ios_enabled }}
        run: python3 scripts/release.py gate

  docker-api:
    name: Publish verified-source Docker image
    needs: [prepare, release-gate]
    if: needs.prepare.outputs.docker_enabled == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute validated image name
        id: image
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/segmeris-api"
          echo "tag=$image:$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "latest=$image:latest" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.api
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: |
            ${{ steps.image.outputs.tag }}
            ${{ steps.image.outputs.latest }}

  create-release:
    name: Verify assets and publish a complete GitHub Release
    if: >-
      always() && needs.prepare.outputs.publish == 'true'
      && needs.release-gate.result == 'success'
      && ((needs.prepare.outputs.docker_enabled == 'true' && needs.docker-api.result == 'success')
      || (needs.prepare.outputs.docker_enabled != 'true' && needs.docker-api.result == 'skipped'))
    needs: [prepare, release-gate, docker-api]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
      IOS_ENABLED: ${{ needs.prepare.outputs.ios_enabled }}
      DOCKER_ENABLED: ${{ needs.prepare.outputs.docker_enabled }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: artifacts
      - name: Require exact assets and generate checksums and release manifest
        run: python3 scripts/release.py stage --source artifacts --directory release
      - name: Upload to a draft, verify every asset, then publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/release.py publish --directory release
