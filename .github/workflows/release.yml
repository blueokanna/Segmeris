name: Build and Release

on:
  push:
    branches:
      - main
      - 'codex/**'
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag name (v1.0.8). Leave empty to build only."
        required: false
        default: ""
      skip_docker:
        description: "Skip publishing the Docker API image (all app artifacts are still built and released)."
        type: boolean
        required: false
        default: false
      skip_ios:
        description: "Skip the iOS build on manual runs (untick to build it). v* tag releases always build iOS."
        type: boolean
        required: false
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  FLUTTER_VERSION: 3.47.9
  PUB_HOSTED_URL: https://pub.dev
  FLUTTER_STORAGE_BASE_URL: https://storage.googleapis.com

jobs:
  validate:
    name: Validate sources and packages
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Validate release versions
        env:
          RELEASE_TAG: ${{ inputs.tag_name }}
        run: python3 scripts/check_versions.py

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup Rust MSRV toolchain
        uses: dtolnay/rust-toolchain@1.89.0

      - name: Validate Rust MSRV and no_std core
        working-directory: rust
        run: |
          cargo check --workspace --all-targets --features api-server --locked
          cargo check -p segmeris-core --no-default-features --locked

      - name: Setup stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Flutter pub get
        run: flutter pub get --enforce-lockfile

      - name: Validate Rust workspace
        working-directory: rust
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --features api-server --locked -- -D warnings
          cargo test --workspace --features api-server --locked
          cargo package -p segmeris-core --locked --allow-dirty

      - name: Validate Flutter application
        run: |
          flutter analyze
          flutter test

  security-scan:
    name: Security scan (Rust / Dart / Container)
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: cargo audit (Rust dependency advisories)
        working-directory: rust
        run: cargo audit --deny warnings

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Flutter pub get
        run: flutter pub get --enforce-lockfile

      - name: Check for outdated Dart dependencies
        run: flutter pub outdated || true

      - name: Scan repository with Trivy (vulns + secrets + misconfig)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          skip-dirs: build,rust/target,.dart_tool,ios/Pods
          exit-code: "0"

  build-android:
    name: Build Android APKs
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 50
    outputs:
      release_signed: ${{ steps.android_signing.outputs.release_signed }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: >-
            aarch64-linux-android,
            armv7-linux-androideabi,
            x86_64-linux-android

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-android-${{ hashFiles('rust/Cargo.lock', 'rust/Cargo.toml') }}
          restore-keys: rust-android-

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Configure Flutter
        run: flutter config --no-analytics

      - name: Flutter pub get
        run: flutter pub get --enforce-lockfile

      - name: Configure Android signing
        id: android_signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          signing_values=("$KEYSTORE_BASE64" "$KEY_ALIAS" "$KEY_PASSWORD" "$STORE_PASSWORD")
          populated_values=0
          for value in "${signing_values[@]}"; do
            [[ -n "$value" ]] && ((populated_values += 1))
          done

          if [[ "$populated_values" -eq "${#signing_values[@]}" ]]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
            {
              printf 'storeFile=app/release.jks\n'
              printf 'storePassword=%s\n' "$STORE_PASSWORD"
              printf 'keyAlias=%s\n' "$KEY_ALIAS"
              printf 'keyPassword=%s\n' "$KEY_PASSWORD"
            } > android/key.properties
            echo "release_signed=true" >> "$GITHUB_OUTPUT"
          elif [[ "$populated_values" -eq 0 ]]; then
            echo "::warning::Android signing secrets are not configured. APKs will use the debug signing key and will not be published as a GitHub Release."
            echo "release_signed=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Configure all Android signing secrets or none of them: ANDROID_KEYSTORE_BASE64, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD, ANDROID_STORE_PASSWORD." >&2
            exit 1
          fi

      - name: Build Android APKs
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        shell: bash
        run: |
          mkdir -p dist/android
          build_apk() {
            local target_platform="$1"
            local artifact_name="$2"
            local log="build-$target_platform.log"
            flutter build apk --release --target-platform="$target_platform" 2>&1 | tee "$log"
            # cargokit logs Rust compile failures and lets Gradle finish anyway, which
            # would ship an APK carrying the previous build's jniLibs.
            if grep -q -E "Cargokit BuildTool failed|failed to run custom build command|could not compile" "$log"; then
              echo "::error::Rust build failed while packaging $artifact_name"
              exit 1
            fi
            local apk="build/app/outputs/flutter-apk/app-release.apk"
            if ! unzip -l "$apk" | grep -q "librust_lib_segmeris.so"; then
              echo "::error::$artifact_name does not embed librust_lib_segmeris.so"
              exit 1
            fi
            cp "$apk" "dist/android/$artifact_name"
          }
          build_apk android-arm64 Segmeris-android-arm64-v8a.apk
          build_apk android-arm Segmeris-android-armeabi-v7a.apk
          build_apk android-x64 Segmeris-android-x86_64.apk
          ls -lah dist/android

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: dist/android/*
          retention-days: 7

  build-windows:
    name: Build Windows x64
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/codex/')
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache verified NuGet CLI
        uses: actions/cache@v4
        with:
          path: build/tools/nuget
          key: windows-nuget-${{ hashFiles('scripts/setup_nuget.ps1') }}

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~\.cargo\registry
            ~\.cargo\git
            rust\target
          key: rust-windows-${{ hashFiles('rust/Cargo.lock', 'rust/Cargo.toml') }}
          restore-keys: rust-windows-

      - name: Flutter pub get
        run: flutter pub get --enforce-lockfile

      - name: Build Windows release bundle
        env:
          CMAKE_GENERATOR: Visual Studio 17 2022
          CMAKE_GENERATOR_PLATFORM: x64
        run: |
          ./scripts/build_windows.ps1 -NoPub

      - name: Verify the release Rust library through Flutter FFI
        run: flutter test --no-pub test/native_runtime_test.dart --dart-define=SEGMERIS_NATIVE_LIBRARY=build/windows/x64/runner/Release/rust_lib_segmeris.dll

      - name: Package Windows artifact
        run: |
          New-Item -ItemType Directory -Force -Path dist\windows | Out-Null
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "dist\windows\Segmeris-windows-x64.zip"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/windows/Segmeris-windows-x64.zip
          retention-days: 7

  build-macos:
    name: Build macOS ${{ matrix.arch }}
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-macos-${{ matrix.arch }}-${{ hashFiles('rust/Cargo.lock', 'rust/Cargo.toml') }}
          restore-keys: rust-macos-${{ matrix.arch }}-

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Flutter pub get
        run: flutter pub get --enforce-lockfile

      - name: Build macOS app
        run: flutter build macos --release

      - name: Package macOS artifact
        shell: bash
        run: |
          mkdir -p dist/macos
          APP_PATH=$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' | head -n 1)
          test -n "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "dist/macos/Segmeris-macos-${{ matrix.arch }}.zip"
          ls -lah dist/macos

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/macos/Segmeris-macos-${{ matrix.arch }}.zip
          retention-days: 7

  build-linux:
    name: Build Linux x64 bundle
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            libsecret-1-dev \
            libjsoncpp-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-linux-${{ hashFiles('rust/Cargo.lock', 'rust/Cargo.toml') }}
          restore-keys: rust-linux-

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Flutter pub get
        run: flutter pub get --enforce-lockfile

      - name: Build Linux release bundle
        run: flutter build linux --release

      - name: Package Linux artifact
        shell: bash
        run: |
          mkdir -p dist/linux
          tar -C build/linux/x64/release/bundle -czf dist/linux/Segmeris-linux-x64.tar.gz .
          ls -lah dist/linux

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: dist/linux/Segmeris-linux-x64.tar.gz
          retention-days: 7

  build-web:
    name: Build Web (JS + WASM)
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Flutter pub get
        run: flutter pub get --enforce-lockfile

      - name: Build Web (JS fallback build)
        run: flutter build web --release

      - name: Package Web JS build
        run: |
          mkdir -p dist/web-js
          cp -r build/web/* dist/web-js/

      - name: Build Web (WASM)
        run: flutter build web --release --wasm

      - name: Package Web WASM build
        run: |
          mkdir -p dist/web-wasm
          cp -r build/web/* dist/web-wasm/

      - name: Upload Web JS artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-js
          path: dist/web-js/
          retention-days: 7

      - name: Upload Web WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-wasm
          path: dist/web-wasm/
          retention-days: 7

  build-ios:
    name: Build iOS arm64 (unsigned)
    if: >-
      startsWith(github.ref, 'refs/tags/v')
      || (github.event_name == 'workflow_dispatch' && github.event.inputs.skip_ios != 'true')
    needs: validate
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-ios-${{ hashFiles('rust/Cargo.lock', 'rust/Cargo.toml') }}
          restore-keys: rust-ios-

      # Validates the `#[cfg(target_os = "ios")]` VideoToolbox FFI code that
      # cannot be compiled on other hosts (needs the Apple SDK headers).
      - name: Cross-check iOS Rust code
        working-directory: rust
        run: cargo check --target aarch64-apple-ios --lib --locked

      - name: Flutter pub get
        run: flutter pub get --enforce-lockfile

      - name: Build iOS app (unsigned, for sideloading)
        shell: bash
        run: |
          set +e
          # -v (verbose) is REQUIRED: without it flutter swallows the
          # xcodebuild details and only prints "linker command failed".
          flutter build ios --release --no-codesign -v > /tmp/ios_build.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "===== LINKER / UNDEFINED SYMBOLS ====="
            grep -n -E "Undefined symbols|referenced from|ld: |framework .*not found|library not found|duplicate symbol|clang: error|error:" /tmp/ios_build.log | head -160 || true
            echo "===== LAST 120 LINES OF BUILD LOG ====="
            tail -n 120 /tmp/ios_build.log || true
          else
            tail -n 10 /tmp/ios_build.log || true
          fi
          exit $status

      - name: Package iOS artifact
        shell: bash
        run: |
          mkdir -p dist/ios
          APP_PATH=$(find build/ios/iphoneos -maxdepth 1 -name '*.app' | head -n 1)
          test -n "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "dist/ios/Segmeris-ios-arm64-unsigned.zip"
          ls -lah dist/ios

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-arm64
          path: dist/ios/Segmeris-ios-arm64-unsigned.zip
          retention-days: 7

  docker-validate:
    name: Validate Docker API image (linux/amd64)
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the API image without pushing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          platforms: linux/amd64
          push: false
          load: true
          tags: segmeris-api:validate
          cache-from: type=gha,scope=docker-api
          cache-to: type=gha,mode=max,scope=docker-api

      - name: Smoke-test the health endpoint
        shell: bash
        run: |
          trap 'docker rm -f segmeris-api-validate >/dev/null 2>&1 || true' EXIT
          docker run -d --name segmeris-api-validate -p 127.0.0.1:3000:3000 segmeris-api:validate
          for attempt in $(seq 1 30); do
            if [ "$(docker inspect --format '{{.State.Running}}' segmeris-api-validate)" != true ]; then
              echo '::error::API container exited before becoming healthy'
              docker inspect --format '{{json .State}}' segmeris-api-validate
              docker logs segmeris-api-validate
              exit 1
            fi
            if curl -fsS --connect-timeout 1 --max-time 2 http://127.0.0.1:3000/health > health.json; then
              python3 -c 'import json; h=json.load(open("health.json")); assert h == {"status":"ok","service":"segmeris-api"}, h'
              echo "health endpoint responded after ${attempt}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::the container never answered /health"
          docker logs segmeris-api-validate || true
          exit 1

  docker-api:
    name: Publish Docker API image
    if: >-
      startsWith(github.ref, 'refs/tags/v')
      || (github.event_name == 'workflow_dispatch' && github.event.inputs.skip_docker != 'true')
    needs: [validate, security-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # QEMU-based arm builds can exceed one hour on a cold Cargo cache.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute Docker tags
        id: docker_tags
        shell: bash
        env:
          MANUAL_TAG: ${{ inputs.tag_name }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/segmeris-api"
          TAGS=("${IMAGE}:sha-${GITHUB_SHA::7}")
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            RELEASE_TAG="${GITHUB_REF#refs/tags/}"
            TAGS+=("${IMAGE}:${RELEASE_TAG}" "${IMAGE}:latest")
          elif [[ -n "$MANUAL_TAG" ]]; then
            RELEASE_TAG="$MANUAL_TAG"
            TAGS+=("${IMAGE}:${RELEASE_TAG}" "${IMAGE}:manual")
          else
            SAFE_REF="${GITHUB_REF_NAME//\//-}"
            TAGS+=("${IMAGE}:${SAFE_REF}")
          fi
          {
            echo 'tags<<EOF'
            printf '%s\n' "${TAGS[@]}"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Build and push Docker API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.docker_tags.outputs.tags }}
          cache-from: type=gha,scope=docker-api
          cache-to: type=gha,mode=max,scope=docker-api

  create-release:
    name: Create GitHub Release
    if: >-
      ${{ !cancelled()
      && (startsWith(github.ref, 'refs/tags/v') || github.event.inputs.tag_name != '')
      && needs.build-android.outputs.release_signed == 'true'
      && needs.build-windows.result == 'success'
      && needs.build-macos.result == 'success'
      && needs.build-linux.result == 'success'
      && needs.build-web.result == 'success'
      && needs.security-scan.result == 'success'
      && needs.docker-api.result != 'cancelled'
      && needs.build-ios.result != 'cancelled' }}
    permissions:
      contents: write
    needs:
      - security-scan
      - build-android
      - build-windows
      - build-macos
      - build-linux
      - build-web
      - build-ios
      - docker-api
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: "!*.dockerbuild"

      - name: Determine release tag
        id: release_tag
        shell: bash
        env:
          MANUAL_TAG: ${{ inputs.tag_name }}
        run: |
          if [[ -n "$MANUAL_TAG" ]]; then
            RELEASE_NAME="$MANUAL_TAG"
          else
            RELEASE_NAME="${GITHUB_REF#refs/tags/}"
          fi
          echo "name=${RELEASE_NAME}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/segmeris-api:${RELEASE_NAME}" >> "$GITHUB_OUTPUT"
          if [[ "${{ needs.docker-api.result }}" == "success" ]]; then
            echo "docker_line=Docker API image: \`ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/segmeris-api:${RELEASE_NAME}\`" >> "$GITHUB_OUTPUT"
          else
            echo 'docker_line=Docker API image was not published for this release (skipped or failed; app artifacts above are unaffected).' >> "$GITHUB_OUTPUT"
          fi
          if [[ "${{ needs.build-ios.result }}" == "success" ]]; then
            echo 'ios_line=iOS arm64 (unsigned) archive: `Segmeris-ios-arm64-unsigned.zip`.' >> "$GITHUB_OUTPUT"
          else
            echo 'ios_line=iOS archive was not built for this release (skipped or failed; other artifacts are unaffected).' >> "$GITHUB_OUTPUT"
          fi

      - name: Compute release file list
        id: release_files
        shell: bash
        run: |
          {
            echo 'files<<EOF'
            echo 'artifacts/android-apks/Segmeris-android-arm64-v8a.apk'
            echo 'artifacts/android-apks/Segmeris-android-armeabi-v7a.apk'
            echo 'artifacts/android-apks/Segmeris-android-x86_64.apk'
            echo 'artifacts/windows-x64/Segmeris-windows-x64.zip'
            echo 'artifacts/macos-x64/Segmeris-macos-x64.zip'
            echo 'artifacts/macos-arm64/Segmeris-macos-arm64.zip'
            echo 'artifacts/linux-x64/Segmeris-linux-x64.tar.gz'
            if [[ "${{ needs.build-ios.result }}" == "success" ]]; then
              echo 'artifacts/ios-arm64/Segmeris-ios-arm64-unsigned.zip'
            fi
            echo 'artifacts/SHA256SUMS'
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: List release files
        run: find artifacts -type f | sort

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          find artifacts -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed -E 's#  artifacts/[^/]+/#  #' > SHA256SUMS
          mv SHA256SUMS artifacts/SHA256SUMS
          cat artifacts/SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: Segmeris ${{ steps.release_tag.outputs.name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ${{ steps.release_tag.outputs.docker_line }}
            ${{ steps.release_tag.outputs.ios_line }}
          files: ${{ steps.release_files.outputs.files }}
